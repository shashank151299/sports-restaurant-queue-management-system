<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Queue Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sports Restaurant - Queue Management</h1>
        </header>

        <div class="stats-section">
            <h2>Queue Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Waitlist</h3>
                    <p id="waitlistCount">0 / 1000</p>
                </div>
                <div class="stat-card">
                    <h3>Main Queue</h3>
                    <p id="mainQueueCount">0 / 1000</p>
                </div>
                <div class="stat-card">
                    <h3>Served Customers</h3>
                    <p id="servedCount">0</p>
                </div>
            </div>
        </div>

        <div class="forms-section">
            <div class="form-card">
                <h2>Add Customer</h2>
                <form id="customerForm">
                    <input type="text" id="customerName" placeholder="Name" required>
                    <input type="email" id="customerEmail" placeholder="Email" required>
                    <input type="tel" id="customerPhone" placeholder="Phone" required>
                    <input type="password" id="customerPassword" placeholder="Password" required>
                    <button type="submit">Join Waitlist</button>
                </form>
            </div>

            <div class="form-card">
                <h2>Add Employee</h2>
                <form id="employeeForm">
                    <input type="text" id="employeeUsername" placeholder="Username" required>
                    <input type="password" id="employeePassword" placeholder="Password" required>
                    <input type="text" id="employeeName" placeholder="Full Name" required>
                    <input type="number" id="employeeQueueLimit" placeholder="Queue Limit" required min="1">
                    <button type="submit">Add Employee</button>
                </form>
            </div>
        </div>

        <div class="queues-section">
            <div class="queue-card">
                <h2>Waitlist</h2>
                <div id="waitlistQueueList" class="queue-list"></div>
            </div>

            <div class="queue-card">
                <h2>Main Queue</h2>
                <div id="mainQueueList" class="queue-list"></div>
            </div>

            <div class="queue-card employee-status-section">
                <h2>Employee Service Status</h2>
                <div id="employeeServiceStatus" class="employee-service-status"></div>
            </div>

            <div class="queue-card served-customers-card">
                <h2>Served Customers</h2>
                <div id="servedCustomersList" class="queue-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
